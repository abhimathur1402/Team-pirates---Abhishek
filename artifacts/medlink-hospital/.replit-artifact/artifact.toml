kind = "web"
previewPath = "/"
title = "MedLink Hospital Admin"
version = "1.0.0"
id = "artifacts/medlink-hospital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25935

[services.development]
run = "pnpm --filter @workspace/medlink-hospital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medlink-hospital", "run", "build" ]
serve = "static"
publicDir = "artifacts/medlink-hospital/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25935"
BASE_PATH = "/"
